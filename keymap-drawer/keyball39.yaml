- p: [16, 17]
  k: {t: '$$mdi:keyboard-return$$', type: enter}
  l: [QWERTY, '[ ] & no.', no. & navi]
- p: [12, 13]
  k: {t: '$$mdi:keyboard-return$$', type: enter}
  l: [QWERTY, '[ ] & no.', no. & navi]
- p: [7, 8]
  k: $$mdi:backspace-reverse-outline$$
  l: [QWERTY]
- p: [22, 23]
  k: $$mdi:backspace-reverse-outline$$
  l: [QWERTY, '`_f & nav', '[ ] & no.']
- p: [6, 7]
  k: {t: '$$mdi:backspace$$', type: backspace}
  l: [QWERTY, '[ ] & no.', no. & navi]
- p: [21, 22]
  k: {t: '$$mdi:backspace$$', type: backspace}
  l: [QWERTY, '`_f & nav', no. & navi]
- p: [10, 11]
  k: {t: '$$mdi:keyboard-tab$$', s: 'Sft+Alt+$$mdi:keyboard-tab$$'}
  l: [QWERTY]
- p: [20, 21]
  k: $$mdi:apple-keyboard-caps$$
  l: [QWERTY]
- p: [0, 1]
  k: $$mdi:keyboard-esc$$
  l: [QWERTY, '[ ] & no.', no. & navi]
- p: [16, 18]
  k: $$mdi:apple-keyboard-option$$
  l: [QWERTY]
- p: [11, 12, 13]
  k: {t: OSL, h: '$$mdi:gesture-tap-hold$$'}
  l: [QWERTY]
- p: [6, 7]
  k: Sft+HOME
  l: ['`_f & nav']
- p: [8, 7]
  k: Sft+END
  l: ['`_f & nav']
- p: [16, 17]
  k: Ctl+$$mdi:arrow-left-bold$$
  l: ['`_f & nav']
- p: [17, 18]
  k: Ctl+$$mdi:arrow-right-bold$$
  l: ['`_f & nav']
- p: [23, 24]
  k: $$mdi:keyboard-space$$
  l: [QWERTY, '[ ] & no.', no. & navi]
- p: [16, 17, 18]
  k: $$mdi:mouse-scroll-wheel$$
  l: [Mouse]
- p: [11, 12]
  k: $$mdi:keyboard-tab$$
  l: [QWERTY, no. & navi, '[ ] & no.']
- p: [1, 2]
  k: $$mdi:keyboard-esc$$
  l: [QWERTY, '[ ] & no.', no. & navi]
- p: [1, 2, 0]
  k: Gui+L
  l: [QWERTY]
